<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Histórico — Bússola</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style/landing-page.css">
    <link rel="stylesheet" href="../style/home.css">
    <link rel="stylesheet" href="../style/fluxo-decisao.css?v=2">
    <link rel="stylesheet" href="../style/historico.css">
    <link rel="stylesheet" href="../style/revisao-etapa.css?v=3">
    <link rel="stylesheet" href="../style/confirmacao-etapa.css">
    <script src="../js/shared/alteracoes-nao-salvas.js?v=3" defer></script>
    <script src="../js/shared/confirmacao-etapa.js" defer></script>
    <script src="../js/shared/revisao-etapa.js?v=4" defer></script>
    <script src="../js/pages/historico-integracoes.js?v=2" defer></script>
    <script src="../js/shared/progresso-etapas.js" defer></script>
    <script src="../js/pages/historico.js?v=4" type="module"></script>
    <link rel="stylesheet" href="../style/fluxo-compacto.css">
</head>
<body class="home-page fluxo-page historico-page">
    <a class="home-skip" href="#conteudo">Ir para o conteúdo</a>
    <div class="home-scene" aria-hidden="true">
        <img src="../assets/images/fundo-cadastro.png" alt="" class="home-map">
        <div class="home-ring"></div>
    </div>
    <header class="home-header">
        <div class="home-header-inner">
            <a href="home.html" class="home-brand" aria-label="Bússola — Início"><span class="home-brand-mark"><img src="../assets/images/home/marca.png" alt=""></span><span>Bússola</span></a>
            <nav class="home-nav" aria-label="Navegação principal">
                <a href="home.html" class="home-nav-link"><img src="../assets/images/home/inicio.svg" alt="" width="15" height="15">Início</a>
                <button type="button" class="home-nav-link" id="historico"><img src="../assets/images/home/historico.svg" alt="" width="15" height="15">Histórico</button>
            </nav>
            <div class="home-account">
                <button class="home-profile" type="button" id="perfil-botao" aria-expanded="false" aria-controls="perfil-menu" disabled>
                    <span class="home-avatar" id="usuario-inicial" aria-hidden="true">…</span><span id="usuario-menu">Minha conta</span>
                    <img src="../assets/images/home/menu.svg" alt="" width="14" height="14">
                </button>
                <div class="home-profile-panel" id="perfil-menu" hidden>
                    <strong id="perfil-nome"></strong><span id="perfil-email"></span>
                    <button type="button" data-destino="perfil">Meu perfil</button>
                </div>
                <button type="button" class="home-exit" id="sair" aria-label="Sair da conta" title="Sair da conta"><img src="../assets/images/home/sair.svg" alt="" width="16" height="16"></button>
            </div>
        </div>
    </header>
<main class="fluxo-conteudo historico-conteudo" id="conteudo" aria-busy="true">
<div class="historico-intro"><div><h1>Histórico de decisões</h1><p id="totais"></p></div><a class="fluxo-proxima" href="nova-decisao.html">+ Nova decisão</a></div>
<form id="filtros" class="historico-filtros"><fieldset id="campos-filtros"><legend class="fluxo-sr-only">Pesquisar decisões</legend>
<label class="historico-busca">Buscar por título<input id="busca" type="search" maxlength="200" placeholder="Buscar por título…"></label>
<label>Status<select id="status"><option value="">Todas</option><option value="CONCLUIDA">Concluídas</option><option value="EM_ANDAMENTO">Em andamento</option></select></label>
<label>Ordenar<select id="ordem"><option value="recentes">Atualizadas recentemente</option><option value="antigas">Atualizadas há mais tempo</option><option value="titulo">Título (A–Z)</option></select></label>
<button class="fluxo-proxima" type="submit">Buscar</button><button class="fluxo-salvar" id="limpar" type="button">Limpar</button>
</fieldset></form>
<p id="mensagem" role="status" aria-live="polite">Carregando seu histórico…</p><button id="recarregar" type="button" class="fluxo-salvar" hidden>Recarregar histórico</button>
<ul id="decisoes" class="historico-lista" aria-label="Decisões encontradas"></ul>
<nav class="historico-paginacao" aria-label="Páginas do histórico"><button type="button" class="fluxo-salvar" id="anterior" disabled>Anterior</button><span id="pagina" aria-live="polite"></span><button type="button" class="fluxo-salvar" id="proxima" disabled>Próxima</button></nav>
</main>
<dialog class="home-dialog" id="aviso" aria-labelledby="aviso-titulo"><h2 id="aviso-titulo"></h2><p id="aviso-texto"></p><form method="dialog"><button class="home-primary">Entendi</button></form></dialog>
<dialog class="home-dialog" id="exclusao" aria-labelledby="exclusao-titulo"><h2 id="exclusao-titulo">Excluir esta decisão?</h2><p id="exclusao-nome"></p><p>A exclusão é permanente: a decisão e todos os registros relacionados serão apagados e não poderão ser recuperados.</p><div class="fluxo-acoes"><button class="fluxo-salvar" id="cancelar-exclusao" type="button">Cancelar</button><button class="fluxo-proxima" id="excluir" type="button">Excluir decisão</button></div></dialog>
</body></html>
