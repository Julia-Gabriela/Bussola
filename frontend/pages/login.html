<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar — Bússola</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style/landing-page.css">
    <link rel="stylesheet" href="../style/cadastro.css">
</head>
<body>
    <div class="scene" aria-hidden="true">
        <img class="map" src="../assets/images/fundo-cadastro.png" alt="">
        <div class="ring ring-lg"></div>
        <div class="ring ring-md"></div>
        <div class="ring ring-sm"></div>
    </div>
    <div class="page">
        <main class="auth">
            <section class="card" aria-labelledby="login-titulo">
                <a class="brand-mark" href="index.html">
                    <img src="../assets/images/icone-bussola.png" alt="" width="72" height="54">
                    <h1 id="login-titulo">Bússola</h1>
                </a>
                <p class="tagline">Sua ferramenta de decisão inteligente</p>

                <div class="tabs" role="group" aria-label="Acesso">
                    <span class="tab is-selected" aria-current="page">Entrar</span>
                    <a class="tab" href="cadastro.html">Criar conta</a>
                </div>

                <form id="login-form" class="form" novalidate>
                    <div class="field">
                        <label for="email">E-mail</label>
                        <input id="email" name="email" type="email" autocomplete="email" maxlength="150" placeholder="seuemail@email.com" spellcheck="false" aria-describedby="email-erro">
                        <p class="field-error" id="email-erro"></p>
                    </div>

                    <div class="field">
                        <label for="senha">Senha</label>
                        <div class="password-field">
                            <input id="senha" name="senha" type="password" autocomplete="current-password" placeholder="Sua senha" aria-describedby="senha-erro">
                            <button class="password-toggle" type="button" aria-label="Mostrar senha" aria-pressed="false" aria-controls="senha">
                                <img src="../assets/images/olho-senha.svg" alt="" width="16" height="16">
                            </button>
                        </div>
                        <p class="field-error" id="senha-erro"></p>
                    </div>

                    <button class="forgot" type="button" id="esqueci-senha">Esqueci minha senha</button>

                    <p class="form-message" id="form-message" aria-live="polite"></p>

                    <button class="submit" type="submit">Acessar minha conta →</button>
                </form>
            </section>
        </main>
    </div>
    <script src="../js/pages/login.js"></script>
</body>
</html>
